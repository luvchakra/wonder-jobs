name: E2E nightly

# The whole Playwright suite, off the merge gate (docs/testing/README.md):
#
#   nightly   03:00 IST on main, against a fresh production build of that commit.
#   manual    Actions → E2E nightly → Run workflow. Pick the branch; optionally list spec files
#             (e.g. "e2e/auth.spec.ts e2e/jobs-apply.spec.ts") to run only those.
#
# Three parts, in parallel (measured 2026-10-15: the whole suite is ~11 min of test time on 2 workers,
# far under the ~30 min that would justify splitting it further by time):
#   local       every spec against a local build with no Supabase: demo journeys, the WorksLake admin
#               portal (it only opens without real auth), the browser helper, résumé templates…
#   signed-in   the specs with signed-in journeys (auth, WorksLake candidate search) against a local
#               build on the Supabase project, with disposable wj-e2e-*@example.com accounts
#   production  the real-account walk-through against the production deployment, same accounts
# signed-in and production need the E2E_SUPABASE_* secrets; without them they report BLOCKED.
#
# Pre-launch (owner, 2026-10-16): the app isn't live, so E2E may use the production Supabase project
# and deployment. E2E_ALLOW_PRODUCTION below is that switch: set it to "false" at launch, when E2E moves
# to a separate test project.
#
# A failed, flaky or cut-short run opens one issue (or comments on the open one). A red nightly is fixed
# before anything else merges (CLAUDE.md).
on:
  schedule:
    - cron: "30 21 * * *" # 03:00 IST
  workflow_dispatch:
    inputs:
      specs:
        description: "Spec files to run, space separated (empty: the whole suite)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: e2e-nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  # The production Supabase project. Refused unless E2E_ALLOW_PRODUCTION is "true" (pre-launch only).
  E2E_FORBIDDEN_SUPABASE_REFS: tybkklggpifpsmsidhok
  E2E_ALLOW_PRODUCTION: "true"
  PRODUCTION_URL: https://jobs.wonderapps.biz

jobs:
  e2e:
    name: E2E (${{ matrix.part.name }})
    runs-on: ubuntu-latest
    # The part's own budget (below) ends the run cleanly first; this is only the backstop.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part:
          - name: local
            supabase: false
            production: false
            specs: ""
            budget_ms: 1800000 # 30 min
          - name: signed-in
            supabase: true
            production: false
            specs: "e2e/auth.spec.ts e2e/jobslake.spec.ts e2e/help-access.spec.ts e2e/hiring.spec.ts"
            budget_ms: 1800000
            # One at a time: these share one server and one Supabase project, and WorksLake's live searches
            # (multi-MB boards, warm-pool reads and writes) stalled the hiring journey's requests for 8–17s
            # when the two ran side by side (nightly run 32).
            workers: 1
          - name: production
            supabase: true
            production: true
            specs: "e2e/real-account.spec.ts"
            budget_ms: 1800000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Which specs this part runs, and whether it can run at all.
      - name: Plan
        id: plan
        env:
          PART: ${{ matrix.part.name }}
          PART_SPECS: ${{ matrix.part.specs }}
          INPUT_SPECS: ${{ inputs.specs }}
          NEEDS_SUPABASE: ${{ matrix.part.supabase }}
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          HAS_SERVICE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          for s in $INPUT_SPECS; do
            case "$s" in *[!A-Za-z0-9_./-]*) echo "::error::Not a spec path: $s"; exit 1 ;; esac
          done
          specs="$PART_SPECS"
          if [ -n "$INPUT_SPECS" ]; then
            if [ -z "$PART_SPECS" ]; then specs="$INPUT_SPECS"; else
              specs=""; for s in $INPUT_SPECS; do case " $PART_SPECS " in *" $s "*) specs="$specs $s" ;; esac; done
            fi
            if [ -z "$specs" ]; then echo "None of the chosen specs belong to the $PART part."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          if [ "$NEEDS_SUPABASE" = "true" ]; then
            if [ -z "$SUPABASE_URL" ] || [ "$HAS_SERVICE_KEY" != "true" ]; then
              echo "::warning::BLOCKED: the $PART part needs the E2E_SUPABASE_URL, E2E_SUPABASE_PUBLISHABLE_KEY and E2E_SUPABASE_SERVICE_ROLE_KEY secrets."
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            for ref in $E2E_FORBIDDEN_SUPABASE_REFS; do
              case "$SUPABASE_URL" in *"$ref"*)
                if [ "$E2E_ALLOW_PRODUCTION" != "true" ]; then echo "::error::E2E_SUPABASE_URL is the production project ($ref) and E2E_ALLOW_PRODUCTION is off."; exit 1; fi
                echo "Pre-launch: using the production Supabase project with disposable wj-e2e accounts." ;;
              esac
            done
          fi
          echo "specs=${specs# }" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"
      - id: pw
        if: steps.plan.outputs.run == 'true'
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: apps/web
      - uses: actions/cache@v4
        if: steps.plan.outputs.run == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - run: npx playwright install --with-deps chromium
        if: steps.plan.outputs.run == 'true'
        working-directory: apps/web
      # Full Chromium, as where the suite was written: headless Playwright otherwise picks its headless
      # shell, which can't load the browser-helper extension and renders the visual baselines differently.
      - if: steps.plan.outputs.run == 'true'
        run: echo "PW_CHROMIUM_PATH=$(node -p "require('@playwright/test').chromium.executablePath()")" >> "$GITHUB_ENV"
        working-directory: apps/web
      # No build cache restored: playwright.config.ts builds the app from scratch before starting it.
      # The run's global setup first deletes throwaway data earlier runs left behind (e2e/cleanup.ts).
      - name: Playwright
        if: steps.plan.outputs.run == 'true'
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ matrix.part.supabase && secrets.E2E_SUPABASE_URL || '' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ matrix.part.supabase && secrets.E2E_SUPABASE_PUBLISHABLE_KEY || '' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ matrix.part.supabase && secrets.E2E_SUPABASE_SERVICE_ROLE_KEY || '' }}
          # Set only for the production part: specs then run against the deployment, nothing is built.
          PLAYWRIGHT_BASE_URL: ${{ matrix.part.production && env.PRODUCTION_URL || '' }}
          SPECS: ${{ steps.plan.outputs.specs }}
          BUDGET_MS: ${{ matrix.part.budget_ms }}
          WORKERS: ${{ matrix.part.workers || 2 }}
        # --global-timeout stops starting tests when the budget runs out and still writes the reports,
        # so the summary below can say what didn't run instead of the job being killed.
        run: |
          [ -n "$PLAYWRIGHT_BASE_URL" ] || unset PLAYWRIGHT_BASE_URL
          npx playwright test --project=chromium --project="Mobile Chrome" --global-timeout="$BUDGET_MS" --workers="$WORKERS" $SPECS || true
      - name: Summary
        if: always() && steps.plan.outputs.run == 'true'
        working-directory: apps/web
        run: node e2e/summary.mjs e2e-results.json >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the report and traces
        if: always() && steps.plan.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.part.name }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/e2e-results.json
          retention-days: 14
          if-no-files-found: ignore
      # Pass only when nothing failed, nothing was flaky and nothing was left unrun.
      - name: Verdict
        if: always() && steps.plan.outputs.run == 'true'
        working-directory: apps/web
        run: node e2e/summary.mjs e2e-results.json --verdict

  # Nobody watches a nightly: a failed, flaky or cut-short run opens one issue, or comments on the one
  # already open, with the run link.
  alert:
    name: Alert on failure
    if: always() && needs.e2e.result != 'success' && needs.e2e.result != 'skipped'
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.e2e.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
        run: |
          title="E2E nightly failing"
          body=$(printf '%s run on `%s` (`%s`): %s — failed, flaky or not run; the run summary lists which.\n\n%s' "$EVENT" "$REF" "${GITHUB_SHA:0:7}" "$RESULT" "$RUN_URL")
          n=$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
