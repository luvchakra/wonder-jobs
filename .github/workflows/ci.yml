name: CI

# What runs when (numbers and the reasoning: docs/performance.md, docs/testing/README.md):
#
#   pull request   Changes → Lint, Typecheck, Unit tests, Build, Dependency audit in parallel → CI.
#                  Lint checks only the changed files and Unit tests runs only the tests related to them
#                  (`vitest related`), unless the PR changes package.json, the lockfile, tsconfig, the
#                  test/lint/build config or CI files: then the whole lint and every unit test.
#                  Docs/Markdown-only PRs run none of them (CI still reports, as passed).
#   push to main   everything: the whole lint, every unit test; also saves the caches PRs restore from.
#
# No E2E here, ever: the Playwright suite runs nightly and on demand in e2e-nightly.yml.
#
# `CI` is the single check branch protection points at: it passes when every job above passed or was
# skipped as not needed, and fails on any failure or cancellation.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

# Least privilege: these jobs only read the repository.
permissions:
  contents: read

# A new push to a PR cancels that PR's older run. Pushes to main are never cancelled (each merged commit
# keeps its own result).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
      full: ${{ steps.decide.outputs.full }}
      lint_files: ${{ steps.decide.outputs.lint_files }}
      web_files: ${{ steps.decide.outputs.web_files }}
      worker: ${{ steps.decide.outputs.worker }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history (trees only) so the diff can start at the PR's merge base or the push's `before`.
          fetch-depth: 0
          filter: blob:none
      - id: decide
        run: bash .github/scripts/ci-changes.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ESLint's own cache, keyed on file content (a fresh checkout changes every mtime): unchanged files
      # reuse their last result. A lockfile change starts it cold.
      - uses: actions/cache/restore@v4
        with:
          path: apps/web/.next/cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/web/eslint.config.*') }}-${{ github.sha }}
          restore-keys: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/web/eslint.config.*') }}-
      - name: Lint everything
        if: needs.changes.outputs.full == 'true'
        run: npx eslint --cache --cache-strategy content --cache-location .next/cache/eslint/
        working-directory: apps/web
      # Only the files this PR changed (a deleted file has nothing to lint; none changed → nothing to do).
      - name: Lint the changed files
        if: needs.changes.outputs.full != 'true' && needs.changes.outputs.lint_files != ''
        run: npx eslint --no-warn-ignored --cache --cache-strategy content --cache-location .next/cache/eslint/ $LINT_FILES
        working-directory: apps/web
        env:
          LINT_FILES: ${{ needs.changes.outputs.lint_files }}
      - if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: apps/web/.next/cache/eslint
          key: eslint-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/web/eslint.config.*') }}-${{ github.sha }}

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsc's incremental state: file versions are content hashes, so it is safe across checkouts.
      - uses: actions/cache/restore@v4
        with:
          path: apps/web/tsconfig.tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/web/tsconfig.json') }}-${{ github.sha }}
          restore-keys: tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/web/tsconfig.json') }}-
      # The only type check: `next build` skips its own on CI and Vercel (next.config.ts). `next typegen`
      # writes the route types that check covered, so tsc validates them too.
      - run: npx next typegen
        working-directory: apps/web
      - run: npm run typecheck
      - if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: apps/web/tsconfig.tsbuildinfo
          key: tsc-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/web/tsconfig.json') }}-${{ github.sha }}

  test:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Every unit test
        if: needs.changes.outputs.full == 'true'
        run: npm run test
      # The tests that import a changed file, directly or through other modules, plus changed tests.
      - name: Unit tests related to the changed files
        if: needs.changes.outputs.full != 'true' && needs.changes.outputs.web_files != ''
        run: npx vitest related --run --passWithNoTests $WEB_FILES
        working-directory: apps/web
        env:
          WEB_FILES: ${{ needs.changes.outputs.web_files }}
      - name: Browser worker unit tests
        if: needs.changes.outputs.full != 'true' && needs.changes.outputs.worker == 'true'
        run: npm run test -w @wonder/browser-worker

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Turbopack's build cache. Restored on every run (PRs read main's), saved only from main.
      - uses: actions/cache/restore@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      - if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}

  # Supply-chain gate: what ships (production dependencies) fails on any high or critical advisory;
  # build and lint tooling (devDependencies) fails on critical. Split 2026-10-03 when GHSA-vfj7-8cjw-p6xm
  # (braces, every version, no patched release) reached us only through eslint-config-next.
  audit:
    name: Dependency audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=critical

  # The single required status check. A job skipped because the change didn't need it counts as passed.
  ci:
    name: CI
    if: always()
    needs: [changes, lint, typecheck, test, build, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$bad" ]; then echo "Did not pass: $bad"; exit 1; fi
