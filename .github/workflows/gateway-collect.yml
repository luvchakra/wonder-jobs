# WorksLake gateway collection, every 3 hours, on this runner (owner, 2026-11-06: moved off Vercel, which had paused the
# site for CPU use). The job runs the app's own collection code (apps/web/scripts/gateway-collect.mjs →
# src/server/gateway/runner.ts) against Supabase: it finishes any Setup job, collects the sources that are due, refreshes
# every module's Find and emails the admins. The site is never called. "Run workflow" by hand starts an Import now
# (mode=all) or Import this module (mode=module), as the admin's buttons do (they dispatch this workflow).
#
# Repository secrets (Settings → Secrets and variables → Actions): SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
# SECRET_ENCRYPTION_KEY (the exact value the site uses), GATEWAY_ADMIN_TOKEN, GATEWAY_CURSOR_SECRET,
# WORKSLAKE_GATEWAY_API_KEY, SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, CONTACT_NOTIFY_EMAILS; variable SITE_URL.
# Until SUPABASE_SERVICE_ROLE_KEY and GATEWAY_ADMIN_TOKEN exist, the last step calls the site instead (CRON_SECRET).
name: Gateway collection

on:
  schedule:
    - cron: "41 */3 * * *" # every 3 hours
  workflow_dispatch:
    inputs:
      mode:
        description: "scheduled: what's due · all: Import now · module: Import this module"
        type: choice
        default: scheduled
        options: [scheduled, all, module]
      module:
        description: "Module id, for mode=module (jobs, internships, teaching, events, …)"
        type: string
        default: ""
      by:
        description: "Who started it (shown on Sources → Import)"
        type: string
        default: "GitHub (Run workflow)"

permissions:
  contents: read

concurrency:
  group: gateway-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SITE: ${{ vars.SITE_URL || 'https://jobs.wonderapps.biz' }}
      RUNNER_READY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' && secrets.GATEWAY_ADMIN_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUNNER_READY == 'true'
      - uses: actions/setup-node@v4
        if: env.RUNNER_READY == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.RUNNER_READY == 'true'
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Collect on this runner
        if: env.RUNNER_READY == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SECRET_ENCRYPTION_KEY: ${{ secrets.SECRET_ENCRYPTION_KEY }}
          GATEWAY_ADMIN_TOKEN: ${{ secrets.GATEWAY_ADMIN_TOKEN }}
          GATEWAY_CURSOR_SECRET: ${{ secrets.GATEWAY_CURSOR_SECRET }}
          WORKSLAKE_GATEWAY_ENABLED: "1"
          WORKSLAKE_GATEWAY_URL: ${{ env.SITE }}
          WORKSLAKE_GATEWAY_API_KEY: ${{ secrets.WORKSLAKE_GATEWAY_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          CONTACT_NOTIFY_EMAILS: ${{ secrets.CONTACT_NOTIFY_EMAILS }}
          WJ_COLLECT_MODE: ${{ inputs.mode || 'scheduled' }}
          WJ_COLLECT_MODULE: ${{ inputs.module }}
          WJ_COLLECT_BY: ${{ inputs.by }}
          WJ_COLLECT_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node apps/web/scripts/gateway-collect.mjs
      - name: Collect through the site (until the runner's secrets are set)
        if: env.RUNNER_READY != 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        # The earlier way: each call collects what fits in the site's 60 s and answers with `next`; this loop calls each
        # `next`. It costs the site's CPU, which is what the runner is for: add the secrets listed at the top.
        run: |
          echo "::warning::The collection runner's secrets aren't set (SUPABASE_SERVICE_ROLE_KEY, GATEWAY_ADMIN_TOKEN, …), so this run calls the site instead. Add them: see the comment at the top of this workflow."
          if [ -z "$CRON_SECRET" ]; then echo "::warning::CRON_SECRET isn't set either: nothing collected."; exit 0; fi
          url="$SITE/api/cron/gateway-collect"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then url="$url?hop=1"; fi
          for i in $(seq 1 30); do
            r=$(curl -fsS --max-time 75 -H "Authorization: Bearer $CRON_SECRET" -H "x-wj-driver: external" "$url" || curl -fsS --max-time 75 -H "Authorization: Bearer $CRON_SECRET" -H "x-wj-driver: external" "$url" || echo '{"summary":"call failed twice"}')
            echo "call $i: $(echo "$r" | jq -r '.summary // "no summary"')"
            next=$(echo "$r" | jq -r 'if .next then "hop=\(.next.hop)&chain=\(.next.chain)&refresh=\(.next.refresh | join(","))" else "" end')
            [ -z "$next" ] && break
            url="$SITE/api/cron/gateway-collect?$next"
          done
