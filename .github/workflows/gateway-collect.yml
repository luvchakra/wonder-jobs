# WorksLake gateway collection every hour, between Vercel's once-a-day cron runs (Vercel's plan allows daily crons only).
# Calls /api/cron/gateway-collect with the same CRON_SECRET Vercel's crons use. The route collects only active sources
# that are due (each source's own interval), honours robots and crawl delays, and is safe to call twice: a source that
# is already being collected is skipped. Needs the repository secret CRON_SECRET (same value as on Vercel).
name: Gateway collection

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SITE: ${{ vars.SITE_URL || 'https://jobs.wonderapps.biz' }}
    steps:
      - name: Collect due gateway sources
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET isn't set as a repository secret, so the gateway collects only with Vercel's daily cron."
            exit 0
          fi
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$SITE/api/cron/gateway-collect"
          echo
