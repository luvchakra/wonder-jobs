# WorksLake gateway collection every 3 hours, between Vercel's once-a-day cron runs (a pace that fits the free plans for a month: domain/gateway/budget.ts).
# Calls /api/cron/gateway-collect with the same CRON_SECRET Vercel's crons use. The route collects only active sources
# that are due (each source's own interval), honours robots and crawl delays, and is safe to call twice: a source that
# is already being collected is skipped. Needs the repository secret CRON_SECRET (same value as on Vercel).
name: Gateway collection

on:
  schedule:
    - cron: "41 */3 * * *" # every 3 hours (domain/gateway/budget.ts: fits the free plans)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SITE: ${{ vars.SITE_URL || 'https://jobs.wonderapps.biz' }}
    steps:
      - name: Collect due gateway sources
        # Each call collects what fits in its 60 s and answers with `next` when more is due (or Find still has modules to
        # refresh). This job calls each `next` in turn: the app never calls itself, which Vercel refuses after about five
        # in a row (508 Loop Detected, 2026-11-05). At most 30 calls; a failed call is tried once more.
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET isn't set as a repository secret, so the gateway collects only with Vercel's daily cron."
            exit 0
          fi
          url="$SITE/api/cron/gateway-collect"
          for i in $(seq 1 30); do
            r=$(curl -fsS --max-time 75 -H "Authorization: Bearer $CRON_SECRET" -H "x-wj-driver: external" "$url" || curl -fsS --max-time 75 -H "Authorization: Bearer $CRON_SECRET" -H "x-wj-driver: external" "$url" || echo '{"summary":"call failed twice"}')
            echo "call $i: $(echo "$r" | jq -r '.summary // "no summary"')"
            next=$(echo "$r" | jq -r 'if .next then "hop=\(.next.hop)&chain=\(.next.chain)&refresh=\(.next.refresh | join(","))" else "" end')
            [ -z "$next" ] && break
            url="$SITE/api/cron/gateway-collect?$next"
          done
