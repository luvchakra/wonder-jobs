# Deploys the cloud browser (apps/browser-worker) to Fly.io. The worker bakes in the extension's helper
# script, so a change to either ships here too. Needs only the FLY_API_TOKEN repository secret (a deploy
# token for the app, from the Fly dashboard or `fly tokens create deploy --app wonderjobs-browser-worker`)
# and is skipped until it's set. The app and its CLOUD_BROWSER_SECRET must exist already (Fly dashboard,
# or scripts/deploy-browser-worker.sh). Run it by hand from the Actions tab for a first deploy: it also
# gives the app its public addresses and keeps it to one machine, which the dashboard can't do.
name: Deploy cloud browser

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/browser-worker/**
      - extension/content/autofill.js

concurrency:
  group: browser-worker-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP: wonderjobs-browser-worker
    steps:
      - name: Skip until FLY_API_TOKEN is set
        if: env.FLY_API_TOKEN == ''
        run: echo "::notice::FLY_API_TOKEN isn't set; the cloud browser wasn't redeployed."
      - uses: actions/checkout@v4
        if: env.FLY_API_TOKEN != ''
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy . --config apps/browser-worker/fly.toml --app "$APP" --ha=false --remote-only
      # Sessions live in one machine's memory: exactly one, in fly.toml's primary_region (sin = Singapore, the
      # nearest to India now Fly has closed Mumbai). Changing the region in fly.toml moves it: a machine is
      # made there, others removed.
      - name: One machine, in the primary region
        if: env.FLY_API_TOKEN != ''
        run: |
          region="$(sed -n "s/^primary_region *= *['\"]\(.*\)['\"]/\1/p" apps/browser-worker/fly.toml)"
          [ -n "$region" ] || { echo "::error::No primary_region in fly.toml"; exit 1; }
          flyctl scale count 1 --region "$region" --app "$APP" --yes
          for id in $(flyctl machines list --app "$APP" --json | jq -r --arg r "$region" '.[] | select(.region != $r) | .id'); do
            flyctl machine destroy "$id" --force --app "$APP"
          done
          flyctl machines list --app "$APP"
      # Without public addresses <app>.fly.dev doesn't resolve. Add a shared IPv4 and an IPv6 once.
      - name: Public addresses
        if: env.FLY_API_TOKEN != ''
        run: |
          ips="$(flyctl ips list --app "$APP" --json)"
          echo "$ips" | grep -qiE '"type": *"(v4|shared_v4)"' || flyctl ips allocate-v4 --shared --app "$APP"
          echo "$ips" | grep -qiE '"type": *"v6"' || flyctl ips allocate-v6 --app "$APP"
          flyctl ips list --app "$APP"
      - name: Health check
        if: env.FLY_API_TOKEN != ''
        run: |
          for _ in $(seq 1 24); do curl -fsS --max-time 10 "https://$APP.fly.dev/health" && exit 0; sleep 5; done
          echo "::error::The worker didn't answer /health"; exit 1

  # A broken cloud browser has no one watching it (2026-10-15: down for a day after a dependency bump).
  # A failed deploy opens one issue, or comments on the one already open.
  alert:
    name: Alert on failure
    needs: deploy
    if: always() && needs.deploy.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Cloud browser down"
          body=$(printf 'Deploy of `%s` failed — the cloud browser may not be answering.\n\n%s' "${GITHUB_SHA:0:7}" "$RUN_URL")
          n=$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
