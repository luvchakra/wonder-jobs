# Weekly dependency and GitHub Actions updates; security updates arrive as soon as an advisory is published.
# Major versions are never proposed (owner, 2026-10-12): they break builds and get closed unmerged. Take a
# major upgrade on purpose, in its own change, when it's wanted.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
