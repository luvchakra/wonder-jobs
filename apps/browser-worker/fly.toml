# fly.toml app configuration file generated for wonderjobs-browser-worker on 2026-10-09T13:41:17Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wonderjobs-browser-worker'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  CLOUD_BROWSER_MAX_SESSIONS = '6'
  PORT = '4100'
  WONDERJOBS_ORIGIN = 'https://jobs.wonderapps.biz'

[http_service]
  internal_port = 4100
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
