<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="wonderjobs-ats" content="greenhouse"><title>Senior Director — Identity · Example (mock Greenhouse)</title>
<style>body{font:14px system-ui;margin:24px;max-width:720px} .field{margin:12px 0} label{display:block;font-weight:600;margin-bottom:4px} input,select,textarea{width:100%;padding:6px;font:inherit} textarea{height:80px}</style></head>
<body>
<h1>Senior Director — Identity</h1><p>Example · Bengaluru</p>
<p><a id="redirect" href="https://evil-redirect.test/apply">Continue on our partner site</a></p>
<form id="application_form" data-confirmation="GH-12345">
  <div class="field"><label for="first_name">First Name *</label><input id="first_name" name="first_name" required autocomplete="given-name"></div>
  <div class="field"><label for="last_name">Last Name *</label><input id="last_name" name="last_name" required autocomplete="family-name"></div>
  <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
  <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
  <div class="field"><label for="resume">Resume/CV *</label><input id="resume" name="resume" type="file" required></div>
  <div class="field"><label for="linkedin">LinkedIn Profile</label><input id="linkedin" name="job_application[answers_attributes][0][text_value]"></div>
  <div class="field"><label for="wa">Are you legally authorized to work in India? *</label><select id="wa" name="wa" required><option value="">Select…</option><option value="1">Yes</option><option value="0">No</option></select></div>
  <div class="field"><label for="why">Why do you want to join Example?</label><textarea id="why" name="why"></textarea></div>
  <div class="field"><label for="gender">Gender</label><select id="gender" name="gender"><option value="">Select…</option><option>Female</option><option>Male</option><option>Decline to self-identify</option></select></div>
  <button type="submit" id="submit_app">Submit Application</button>
</form>
<script src="/__portal/_submit.js"></script>
</body></html>
