<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sign in · Example careers (mock)</title>
<style>body{font:14px system-ui;margin:24px;max-width:520px} input{width:100%;padding:6px;margin:4px 0}</style></head>
<body>
<h1>Sign in to apply</h1>
<form id="login" data-kind="login">
  <label for="u">Email</label><input id="u" type="email" autocomplete="username">
  <label for="p">Password</label><input id="p" type="password" autocomplete="current-password">
  <button type="submit" id="signin">Sign in</button>
</form>
<template id="app">
  <h1>Application</h1>
  <iframe id="captcha" title="reCAPTCHA challenge" src="about:blank" width="304" height="78" style="border:1px solid #ccc"></iframe>
  <form data-confirmation="GH-LOGIN-9">
    <p><label for="first_name">First Name</label><input id="first_name" name="first_name" required></p>
    <p><label for="last_name">Last Name</label><input id="last_name" name="last_name" required></p>
    <p><label for="email">Email</label><input id="email" name="email" type="email" required></p>
    <button type="submit">Submit Application</button>
  </form>
</template>
<script>
  // Signing in is the candidate's own action; the page then shows the application (with a verification challenge).
  document.getElementById("login").addEventListener("submit", (e) => {
    e.preventDefault();
    document.body.innerHTML = document.getElementById("app").innerHTML;
    const s = document.createElement("script");
    s.src = "/__portal/_submit.js";
    document.body.appendChild(s);
  });
</script>
</body></html>
