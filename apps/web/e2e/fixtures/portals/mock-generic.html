<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Careers · Mock Employer (generic form)</title>
<style>body{font:14px system-ui;margin:24px;max-width:720px} p{margin:12px 0} input,textarea,select{width:100%;padding:6px}</style></head>
<body>
<h1>Head of Security Engineering</h1>
<form data-confirmation="ME-2026-0042">
  <p><label>Given name <input name="gn" aria-required="true"></label></p>
  <p><label>Family name <input name="fam" aria-required="true"></label></p>
  <p><label>E-mail address <input name="contact_mail"></label></p>
  <p><label>Mobile <input name="mob"></label></p>
  <p><label>Where are you based? <input name="base"></label></p>
  <p><label>Expected salary (annual) <input name="exp_sal" required></label></p>
  <p><label>Notice period <input name="np"></label></p>
  <p><label>Describe an achievement and quantify its impact <textarea name="ach"></textarea></label></p>
  <p><label>How did you hear about us? <input name="src"></label></p>
  <p><label>CV <input type="file" name="cv"></label></p>
  <p><label>Additional resume <input type="file" name="cv2"></label></p>
  <p><label><input type="checkbox" name="consent" required> I agree to the privacy notice</label></p>
  <button type="submit">Send application</button>
</form>
<script src="/__portal/_submit.js"></script>
</body></html>
